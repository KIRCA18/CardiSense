spring.config.import=optional:file:./.env[.properties]
spring.application.name=backend
server.port=8000
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

cardisense.model-service.base-url=http://127.0.0.1:8001

# Fill in with your actual Postgres instance. Required now that
# spring-boot-starter-data-jpa is on the classpath - the app will fail to
# start without a reachable datasource.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# validate in prod once you have real migrations; update for local dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}