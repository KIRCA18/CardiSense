# Start everything with:
#   docker compose --env-file backend/.env up --build
# backend/.env (see backend/.env_schema) provides the database, JWT and mail settings.

name: cardisense

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cardisense}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-service:
    build: ./model-service
    environment:
      ECG_FM_DEVICE: cpu
      ECG_FOUNDER_DEVICE: cpu
    volumes:
      - ./model-service/ckpts:/app/ckpts
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20m

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      CARDISENSE_MODELSERVICE_BASEURL: http://model-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      model-service:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
